info:
  name: Nearby stations for Google Maps
  type: http
  seq: 8

http:
  method: GET
  url: http://localhost:5281/api/stations/nearby?lat=&lng=&radius=
  params:
    - name: lat
      value: ""
      type: query
    - name: lng
      value: ""
      type: query
    - name: radius
      value: ""
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
